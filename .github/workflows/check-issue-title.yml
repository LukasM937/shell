name: Check issue title

# CI is switched off in this fork (see CLAUDE.md). Manual runs only.
on:
  workflow_dispatch:

permissions:
  issues: write

jobs:
  check-issue-title:
    if: github.event.action != 'edited' || github.event.changes.title != null
    uses: caelestia-dots/.github/.github/workflows/check-issue-title.yml@main
    concurrency:
      group: check-issue-title-${{ github.event.issue.number }}
      cancel-in-progress: true
    with:
      prefixes: >-
        [["crash","CRASH"],["bug","BUG"],["enhancement","FEATURE"]]
