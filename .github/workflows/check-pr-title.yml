name: Check PR title

# CI is switched off in this fork (see CLAUDE.md). Manual runs only.
on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  check-pr-title:
    if: ${{ github.event.action != 'edited' || github.event.changes.title || github.event.changes.base }}
    concurrency:
      group: check-pr-title-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    uses: caelestia-dots/.github/.github/workflows/check-pr-title.yml@main
    with:
      scope_file: .github/scopes.txt
