# Defaults. install.sh/sync.py write the colours of the current Caelestia scheme, the wallpaper and the
# profile picture into theme.conf.user, which overrides this file.
[General]
# 24 hour clock; true gives 12 hours with an AM/PM chip
twelveHour=false
# Opacity of the panel, 1 is solid. sync.py copies appearance.transparency from the shell config
panelOpacity=1
# Set by sync.py
background=background

# Material 3 palette, dark
primary="#9ccbfb"
onPrimary="#003354"
primaryContainer="#00497a"
onPrimaryContainer="#cfe5ff"
secondary="#b9c8da"
onSecondary="#233240"
secondaryContainer="#3a4857"
onSecondaryContainer="#d5e4f7"
tertiary="#d3bfe6"
surface="#101418"
onSurface="#e0e2e8"
onSurfaceVariant="#c1c7ce"
surfaceContainer="#1c2024"
surfaceContainerHigh="#262a2f"
surfaceContainerHighest="#31353a"
outline="#8b9198"
outlineVariant="#41484d"
error="#ffb4ab"
onError="#690005"
errorContainer="#93000a"
onErrorContainer="#ffdad6"
shadow="#000000"
